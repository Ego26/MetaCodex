# The daily data run - the same steps as tools/collect-all.js, only on
# GitHub instead of a machine that has to be on in the morning.
#
# What comes out does NOT go into git: 13 MB of Lua that change every
# night would bloat the repository by gigabytes a year. Instead the
# finished addon is packed and attached to the release "nightly" - always
# the same release, always the newest file.
#
# The Warcraft Logs and Battle.net credentials come from the repository
# secrets WCL_CLIENT_ID / WCL_CLIENT_SECRET and BNET_CLIENT_ID /
# BNET_CLIENT_SECRET. They are in no file.
name: Daily data

on:
  schedule:
    # 04:30 UTC - after the daily leaderboard reset, before the European
    # evening.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      reuse:
        description: "Run-ID eines frueheren Laufs, dessen gesammelte Daten
          wiederverwendet werden sollen (die lange Zahl in seiner Adresse).
          Leer lassen, um frisch zu sammeln."
        required: false
        default: ""

permissions:
  contents: write
  # Zum Holen der Daten aus einem anderen Lauf.
  actions: read

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Warcraft Logs waits for its hourly quota; a full run can take two
    # hours.
    # Mehr Berichte, mehr Zeit. Der Lauf vom 24.09. brauchte mit 880
    # Berichten gut drei Stunden; mit rund zweitausend wird es knapp
    # vier, und Wartezeiten am Stundenlimit koennen dazukommen.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags come along: the CurseForge build at the end packs the
          # code of the newest release, and git needs the history to know
          # which one that is.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect every source and build the tables
        if: inputs.reuse == ''
        env:
          # The account behind these credentials has 9,000 points an hour
          # (Gold). A whole run costs just under 5,000, so it fits into one
          # hour without waiting. On the free limit of 3,600 it stopped
          # halfway and waited an hour.
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: node tools/collect-all.js .

      # Die Ernte eines frueheren Laufs statt einer neuen.
      #
      # Drei Stunden Sammeln, und dann scheitert das Packen an einem
      # fehlenden Ausfuehrungsrecht - so geschehen in der Nacht auf den
      # 24.09. Danach noch einmal drei Stunden zu sammeln, um dieselben
      # Zahlen zu bekommen, waere die falsche Antwort gewesen: die Daten
      # lagen ja vor. Mit der Run-ID jenes Laufs holt dieser sie sich und
      # macht in zwei Minuten dort weiter, wo es schiefging.
      - name: Take what an earlier run collected
        if: inputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          # Nach Muster statt nach Namen: ein Lauf legt genau eine solche
          # Sicherung ab, und so passt es auch auf die aelteren, die noch
          # nach der laufenden Nummer benannt sind.
          pattern: collected-*
          merge-multiple: true
          run-id: ${{ inputs.reuse }}
          github-token: ${{ github.token }}
          path: .

      - name: Say what came back
        if: inputs.reuse != ''
        run: |
          echo "Aus Lauf ${{ inputs.reuse }}:"
          ls -l MetaCodex_Data MetaCodex_Dungeons MetaCodex_Players
          test -s MetaCodex_Data/Catalog.lua
          test -s MetaCodex_Data/Recommendations.lua

      # Erst sichern, dann weitermachen.
      #
      # Der Lauf vom 24.09. sammelte 199 Minuten lang, bestand die Tests
      # und scheiterte danach am Packen - weil dem Skript im Git das
      # Ausfuehrungsrecht fehlte. Weil die Sicherung damals hinter dem
      # Packen stand, war die ganze Nacht Arbeit weg, samt der Punkte
      # bei Warcraft Logs. Jetzt liegen die Rohdaten UND die fertigen
      # Tabellen fest, bevor etwas anderes sie mitreissen kann, und zwar
      # auch dann, wenn der Schritt davor gescheitert ist.
      - name: Keep what was collected
        if: always() && inputs.reuse == ''
        uses: actions/upload-artifact@v4
        with:
          name: collected-${{ github.run_id }}
          path: |
            tools/data/*.json
            MetaCodex_Data/*.lua
            MetaCodex_Dungeons/*.lua
            MetaCodex_Players/*.lua
          retention-days: 7

      - name: Tests against the fresh data
        working-directory: Tests
        run: |
          npm install --no-audit --no-fund
          node run.js smoke_test.lua
          node run.js

      - name: Build the package
        id: pack
        run: |
          YMD="$(date -u +%Y%m%d)"
          STAMP="nightly-$YMD"
          bash tools/package.sh "$STAMP" dist
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "ymd=$YMD" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Update the "nightly" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly data
          prerelease: true
          body: |
            The addon with the data of ${{ steps.pack.outputs.stamp }}.
            Unpack into `Interface/AddOns` - it is four folders.
          files: dist/MetaCodex-${{ steps.pack.outputs.stamp }}.zip

      # And the same data to CurseForge - that is the point of the whole
      # run. Nobody should have to upload a file by hand every morning.
      #
      # What goes up is NOT the current state of main: it is the code of
      # the newest tag with the data of tonight. Main is where work
      # happens, and a commit from the small hours has no business being a
      # release by morning. What was released stays released; only its
      # tables are newer.
      - name: Which code was released last?
        id: released
        run: |
          TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ]; then
            echo "No release tag yet, so nothing goes to CurseForge tonight." >&2
          else
            echo "Packing $TAG with the data of ${{ steps.pack.outputs.date }}." >&2
          fi

      - name: Take the released code, keep tonight's data
        if: steps.released.outputs.tag != ''
        run: |
          # The data files are untracked, so the checkout leaves them where
          # they are. Staging them afterwards is what makes the packager
          # take them along.
          git checkout --detach "${{ steps.released.outputs.tag }}"
          git add -f MetaCodex_Data MetaCodex_Dungeons MetaCodex_Players
          test -s MetaCodex_Data/Recommendations.lua
          # The change notes of that release, with one line saying which
          # night these tables are from.
          { echo "**Data of ${{ steps.pack.outputs.date }}.**"; echo; cat RELEASE-NOTES.md; } > /tmp/notes.md
          mv /tmp/notes.md RELEASE-NOTES.md

      - name: Upload to CurseForge
        if: steps.released.outputs.tag != ''
        uses: BigWigsMods/packager@v2
        env:
          # From the CurseForge account under "API Tokens". No token, no
          # upload - the run says so and stops there.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Deliberately no GITHUB_OAUTH here: the GitHub side was done
          # above, under the release "nightly". The packager would
          # otherwise hang another file on the release of the tag.
        with:
          # Same code, new data, every night - so the file name has to say
          # which night, otherwise CurseForge shows a dozen files of the
          # same name.
          args: >-
            -n "{package-name}-{project-version}-data-${{ steps.pack.outputs.ymd }}:{project-version} (data ${{ steps.pack.outputs.date }})"
