# A release: push a tag v1.2.3, done.
#
# The code of that tag is packed with the data of the latest nightly -
# exactly what the nightly held at that moment, only with a version
# number instead of a date.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the data from the latest nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly --pattern 'MetaCodex-*.zip' --dir /tmp/nightly
          cd /tmp/nightly && unzip -q MetaCodex-*.zip
          for addon in MetaCodex_Data MetaCodex_Dungeons MetaCodex_Players; do
            mkdir -p "$GITHUB_WORKSPACE/$addon"
            cp -r "/tmp/nightly/$addon/." "$GITHUB_WORKSPACE/$addon/"
          done

      - name: Build the package
        run: tools/package.sh "${GITHUB_REF_NAME}" dist

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/MetaCodex-${{ github.ref_name }}.zip
