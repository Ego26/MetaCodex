# A release: push a tag v1.2.3, done.
#
# The code of that tag is packed with the data of the latest nightly -
# exactly what the nightly held at that moment, only with a version number
# instead of a date. The package then goes to CurseForge and to a GitHub
# release, both from here.
#
# CurseForge offers to pack the repository itself. That must stay switched
# off for this project: the data are deliberately not in git, so a package
# built from the repository alone would install an addon with an empty
# window.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager derives the version from the tag, and it needs the
          # history to find it.
          fetch-depth: 0

      - name: Fetch the data from the latest nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Das Release "nightly" traegt mehrere Naechte - jede Nacht
          # haengt ihre eigene Datei an, benannt nach ihrem Datum. Der
          # Mustertreffer holt sie deshalb ALLE, und "unzip datei1 datei2"
          # heisst fuer unzip: nimm die erste als Archiv und den Rest als
          # Namen darin. Das Ergebnis waere im besten Fall ein Abbruch, im
          # schlechteren ein Paket mit den Zahlen von vorgestern.
          #
          # Also ausdruecklich die neueste: die Namen tragen das Datum,
          # alphabetisch sortiert ist das auch die zeitliche Reihenfolge.
          gh release download nightly --pattern 'MetaCodex-*.zip' --dir /tmp/nightly
          cd /tmp/nightly
          newest=$(ls -1 MetaCodex-*.zip | sort | tail -1)
          echo "Daten aus: $newest"
          unzip -q "$newest"
          for addon in MetaCodex_Data MetaCodex_Dungeons MetaCodex_Players; do
            mkdir -p "$GITHUB_WORKSPACE/$addon"
            cp -r "/tmp/nightly/$addon/." "$GITHUB_WORKSPACE/$addon/"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The catalog is rebuilt here, from the code of this very tag.
      #
      # It is not a measurement. It is read straight out of the game
      # data, and what it must contain is decided by the addon code -
      # which changed three times on 27 September alone: the kind of an
      # instance, the boss list of a raid, which content is current.
      # Each time the code shipped with a catalog that did not know
      # about it yet, and each time the fix was a manual data run before
      # the tag. Code and the table it reads belong to the same version.
      #
      # The measurements are NOT rebuilt - they come from the night, and
      # collecting them again would cost hours. Only the catalog, which
      # costs four minutes and no quota at all.
      #
      # And it fails loudly when it fails. v1.1.2 shipped with the
      # catalog of the night because this step swallowed its error: the
      # script died on a missing tools/data directory, "|| echo" turned
      # that into a shrug, and the test below passed on the file that was
      # already there. A release that quietly ships a mismatched table is
      # exactly what this step exists to prevent - so if the catalog
      # cannot be built, there is no release.
      - name: Rebuild the catalog from this tag
        run: |
          node tools/build-catalog.js .
          test -s MetaCodex_Data/Catalog.lua
          grep -q "instCurrent = {" MetaCodex_Data/Catalog.lua

      # Without this the package would be built without the data.
      #
      # The packager asks git which files are untracked and ignores exactly
      # those - a sensible rule, and here the wrong one: the tables were
      # just copied in and git has never seen them. Staging them makes them
      # known without committing anything; the checkout is thrown away
      # afterwards anyway.
      - name: Let git know about the data
        run: |
          git add -f MetaCodex_Data MetaCodex_Dungeons MetaCodex_Players
          # Ohne "| head": GitHub faehrt diese Zeilen mit "set -eo pipefail",
          # und wenn head die Leitung nach fuenf Zeilen schliesst, stirbt
          # git an SIGPIPE und der Schritt gilt als gescheitert. Genau so
          # eine Kleinigkeit hat in der Nacht auf den 24.09. drei Stunden
          # Sammelarbeit gekostet.
          git -c core.fileMode=false status --short
          test -s MetaCodex_Data/Recommendations.lua

      - name: Build and upload
        uses: BigWigsMods/packager@v2
        env:
          # From the CurseForge account under "API Tokens", kept here as a
          # repository secret. Without it the packager builds but uploads
          # nothing.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          # Wago Addons, from https://addons.wago.io/account/apikeys. The
          # packager only uploads there once the TOC carries X-Wago-ID; until
          # then this line costs nothing.
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # Creates the GitHub release along the way and attaches the zip.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
